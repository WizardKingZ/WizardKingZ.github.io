      allow_cash: !!m.allow_cash,
      use_bounds: !!m.use_bounds,
      use_views: !!m.use_views,
      tau: +m.tau,
      views: universe.views,
    };
  }

  function run(request, universes) {
    const base = universes.find((u) => u.key === request.universe);
    if (!base) throw new Error(`Unknown universe ${request.universe}.`);
    const universe = Object.assign({}, base);
    ['expected_returns', 'bounds', 'current_weights', 'views'].forEach((f) => {
      if (f in request) universe[f] = request[f];
    });
    const settings = settingsFor(universe, request);
    const opt = new PortfolioOptimizer(universe, settings);
    const warnings = [];
    const optimal = describe(opt, 'optimal', 'Optimal', opt.solve(), opt.usesCash());
    const portfolios = [optimal];
    if (settings.use_views && settings.views.length) {
      const prior = new PortfolioOptimizer(universe, Object.assign({}, settings, { use_views: false }));
      portfolios.push(describe(opt, 'prior', 'Before views', prior.solve(), prior.usesCash()));
    }
    const current = universe.current_weights || {};
    if (Object.keys(current).length) {
      portfolios.push(describe(opt, 'current', 'Current', opt.names.map((a) => current[a] || 0), true));
    }
    [['max_sharpe', 'Max Sharpe'], ['min_volatility', 'Min volatility']].forEach(([key, label]) => {
      if (key === settings.objective) return;
      try {
        portfolios.push(describe(opt, key, label, opt.solve(key), false));
      } catch (error) {
        warnings.push(`${label}: ${error.message}`);
      }
    });
    const n = opt.names.length;
    portfolios.push(describe(opt, 'equal', 'Equal weight', new Array(n).fill(1 / n), false));

    const reference = portfolios.find((p) => p.key === 'current' || p.key === 'prior');
    let active = null;
    if (reference) {
      const withCash = (p) => p.weights.concat([p.stats.cash]);
      const padded = opt.cov.map((row) => row.concat([0])).concat([new Array(n + 1).fill(0)]);
      active = Object.assign({ against: reference.label }, activeRisk(withCash(optimal), withCash(reference), padded));
    }
    const views = !settings.use_views ? [] : settings.views.map((v) => {
      const p = opt.names.map((a) => v.weights[a] || 0);
      return { label: v.label, view: v.expected_return, prior: dot(p, opt.priorReturns), posterior: dot(p, opt.mu) };
    });
    return {
      universe: universe.key,
      objective: settings.objective,
      objective_label: OBJECTIVE_LABELS[settings.objective],
      names: opt.names,
      risk_free_rate: opt.rf,
      prior_returns: opt.priorReturns,
      expected_returns: opt.mu,
      volatilities: opt.cov.map((row, i) => Math.sqrt(row[i])),
      lower: opt.lower.map((v) => (Number.isFinite(v) ? v : null)),
      upper: opt.upper.map((v) => (Number.isFinite(v) ? v : null)),
      portfolios,
      active,
      views,
      frontier: {
        unbounded: opt.frontier(false),
        bounded: opt.constraints ? opt.frontier(true) : null,
      },
      correlation: opt.cov.map((row, i) => row.map((v, j) => v / Math.sqrt(opt.cov[i][i] * opt.cov[j][j]))),
      history: universe.history || {},
      warnings,
    };
  }

  const api = { run, normIsf, OBJECTIVE_LABELS };
  root.POEngine = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  'use strict';
  const D = window.PO_DEFAULTS;
  const UNIVERSES = D.universes;
  const OBJECTIVES = D.objectives;
  const OBJ_SHORT = {
    max_sharpe: ['Max Sharpe ratio', 'tangency'],
    min_volatility: ['Min volatility', 'lowest risk'],
    target_return: ['Target return', 'min risk for return'],
    target_volatility: ['Target volatility', 'max return for risk'],
    max_utility: ['Risk aversion', 'mean-variance utility'],
  };
  const OBJ_HELP = {
    max_sharpe: 'Highest return per unit of risk, fully invested. Choose it when cash or leverage can scale the whole book up or down; the capital market line shows those mixes.',
    min_volatility: 'Lowest-risk fully invested mix. It ignores expected returns, so choose it when you trust the risk estimates more than the return estimates.',
    target_return: 'Lowest-risk mix that earns at least the target. Choose it when the return hurdle is fixed, such as a spending rule or a liability rate.',
    target_volatility: 'Highest-return mix within a risk budget. Choose it when the board sets a volatility limit.',
    max_utility: 'Maximizes expected return minus λ/2 × variance. A higher λ gives a more conservative mix; start near 3 and compare.',
  };
  let guideOpen = true;
  try { guideOpen = localStorage.getItem('po-calc-guide') !== 'closed'; } catch (e) {}
  const PORT_COLOR = { optimal: 'var(--s1)', current: 'var(--s2)', prior: 'var(--s5)', max_sharpe: 'var(--s3)', min_volatility: 'var(--s4)', equal: 'var(--s6)' };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Rounds away negative zero so -0.0% never shows.
  const fix = (x, d) => { const t = (x * 100).toFixed(d); return /^-0\.?0*$/.test(t) ? t.slice(1) : t; };
  const pct = (x, d = 1) => (x == null || !isFinite(x) ? '–' : fix(x, d) + '%');
  const pp = (x, d = 1) => { if (x == null) return '–'; const t = fix(x, d); return (t.startsWith('-') ? '' : '+') + t + ' pp'; };
  // Table formats: negatives in parentheses, no plus signs.
  const tpct = (x, d = 1) => { if (x == null || !isFinite(x)) return '–'; const t = fix(x, d); return t.startsWith('-') ? `(${t.slice(1)}%)` : t + '%'; };
  const tpp = (x, d = 1) => { if (x == null) return '–'; const t = fix(x, d); if (/^0\.?0*$/.test(t)) return '–'; return t.startsWith('-') ? `(${t.slice(1)}) pp` : t + ' pp'; };
  const num = (x, d = 2) => (x == null || !isFinite(x) ? '–' : x.toFixed(d));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const assetColor = (i) => `var(--c${(i % 12) + 1})`;

  // State: one editable copy of each universe's inputs.
  let state = {};
  function freshState(u) {
    return {
      settings: clone(u.defaults),
      expected_returns: u.expected_returns.slice(),
      bounds: clone(u.bounds),
      current_weights: clone(u.current_weights),
      views: clone(u.views),
    };
  }
  UNIVERSES.forEach((u) => { state[u.key] = freshState(u); });
  let active = UNIVERSES[0].key;
  try { const s = localStorage.getItem('po-calc-tab'); if (s && state[s]) active = s; } catch (e) {}
  const uni = () => UNIVERSES.find((u) => u.key === active);
  const st = () => state[active];

  // Engine: the in-page port of the library.
  let lastResult = null;
  let seq = 0;

  function request() {
    const s = st();
    return {
      universe: active,
      settings: s.settings,
      expected_returns: s.expected_returns,
      bounds: s.bounds,
      current_weights: s.current_weights,
      views: s.views,
    };
  }

  async function compute(req) {
    return window.POEngine.run(req, UNIVERSES);
  }

  let timer = null;
  function refresh() {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const my = ++seq;
      const t0 = performance.now();
      $('results').classList.add('stale');
      try {
        const res = await compute(request());
        if (my !== seq) return;
        lastResult = res;
        renderResults(res, null);
      } catch (e) {
        if (my !== seq) return;
        renderResults(lastResult && lastResult.universe === active ? lastResult : null, e.message);
      }
      $('results').classList.remove('stale');
      $('engine').textContent = 'Runs in your browser' + ` · ${Math.round(performance.now() - t0)} ms`;
    }, 120);
  }

  // Tabs and inputs.
  function renderTabs() {
    $('tabs').innerHTML = UNIVERSES.map((u) => `<button type="button" data-k="${u.key}" class="${u.key === active ? 'on' : ''}">${esc(u.title.split(':')[0])}</button>`).join('');
    $('tabs').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      active = b.dataset.k;
      try { localStorage.setItem('po-calc-tab', active); } catch (e) {}
      lastResult = null;
      renderTabs(); renderInputs(); refresh();
    }));
  }

  function pctInput(id, value, step, unit) {
    return `<div class="inbox"><input id="${id}" type="number" step="${step}" value="${+(value * 100).toFixed(4)}"><span class="u">${unit || '%'}</span></div>`;
  }

  function renderInputs() {
    const u = uni();
    const s = st();
    const S = s.settings;
    const objParam = {
      target_return: `<div class="field"><label for="p_tr">Target expected return</label>${pctInput('p_tr', S.target_return, 0.25)}</div>`,
      target_volatility: `<div class="field"><label for="p_tv">Target volatility</label>${pctInput('p_tv', S.target_volatility, 0.25)}</div>`,
      max_utility: `<div class="field"><label for="p_ra">Risk aversion (λ)</label><div class="inbox"><input id="p_ra" type="number" step="0.5" min="0.1" value="${S.risk_aversion}"><span class="u">×</span></div></div>`,
    }[S.objective] || '';
    const hasBounds = Object.keys(u.bounds).length > 0;
    const hasCurrent = Object.keys(u.current_weights).length > 0;
    const rows = u.asset_names.map((a, i) => {
      const b = s.bounds[a] || [null, null];
      const base = u.bounds[a] || [null, null];
      const chg = (x, y) => (Math.abs((x ?? 0) - (y ?? 0)) > 1e-12 ? 'chg' : '');
      return `<tr><td title="${esc(a)}"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${assetColor(i)};margin-right:5px"></i>${esc(a)}</td>
        <td><input data-i="${i}" data-f="mu" type="number" step="0.1" class="${chg(s.expected_returns[i], u.expected_returns[i])}" value="${+(s.expected_returns[i] * 100).toFixed(3)}" aria-label="${esc(a)} expected return"></td>
        <td><input data-a="${esc(a)}" data-f="lo" type="number" step="1" ${S.use_bounds ? '' : 'disabled'} class="${chg(b[0], base[0])}" value="${b[0] == null ? '' : +(b[0] * 100).toFixed(2)}" placeholder="–" aria-label="${esc(a)} minimum weight"></td>
        <td><input data-a="${esc(a)}" data-f="hi" type="number" step="1" ${S.use_bounds ? '' : 'disabled'} class="${chg(b[1], base[1])}" value="${b[1] == null ? '' : +(b[1] * 100).toFixed(2)}" placeholder="–" aria-label="${esc(a)} maximum weight"></td></tr>`;
    }).join('');
    const views = s.views.map((v, k) => renderView(v, k, u)).join('');
    $('inputs').innerHTML = `
      <div class="ptitle">${esc(u.title)}</div>
      <details class="guide" id="guide" ${guideOpen ? 'open' : ''}><summary>How to use this calculator</summary><ol>
        <li>Choose an objective and set its target.</li>
        <li>Set the rules: weight bounds, cash at the risk-free rate and views.</li>
        <li>Edit expected returns or bounds in the asset table where you disagree with them.</li>
        <li>Add view portfolios to express tactical calls.</li>
        <li>Read the recommendation, then check where the mix sits on the frontier and how it changes with risk.</li>
      </ol></details>
      <h3 class="ss">Objective</h3>
      <div class="objs">${OBJECTIVES.map((o) => `<button type="button" class="obj ${o.key === S.objective ? 'on' : ''}" data-o="${o.key}">${OBJ_SHORT[o.key][0]}<small>${OBJ_SHORT[o.key][1]}</small></button>`).join('')}</div>
      <div class="hint">${OBJ_HELP[S.objective]}</div>
      ${objParam}
      <h3 class="ss">Rules</h3>
      <label class="tog"><span>Weight bounds<small>${hasBounds ? 'Min and max per asset, below' : 'This universe has none'}</small></span><input type="checkbox" id="t_b" ${S.use_bounds ? 'checked' : ''} ${hasBounds ? '' : 'disabled'}></label>
      <label class="tog"><span>Cash at the risk-free rate<small>Hold or borrow cash at ${pct(u.risk_free_rate, 2)} (target return, target volatility, risk aversion)</small></span><input type="checkbox" id="t_c" ${S.allow_cash ? 'checked' : ''}></label>
      <label class="tog"><span>Apply views (Black-Litterman)<small>Blend the view portfolios below into expected returns</small></span><input type="checkbox" id="t_v" ${S.use_views ? 'checked' : ''}></label>
      <div class="field"><label for="p_tau">Prior precision τ (model R²)</label><div class="inbox"><input id="p_tau" type="number" step="0.01" min="0.001" value="${S.tau}"><span class="u">τ</span></div></div>
      <p class="note">τ sets how far views move expected returns: a higher τ gives views more weight. Values of 0.025–0.1 are common.</p>
      <h3 class="ss">Assets <span class="r">annual, %</span></h3>
      <table class="atab"><thead><tr><th>Asset</th><th>E[r]</th><th>Min</th><th>Max</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="note">Risk-free rate ${pct(u.risk_free_rate, 2)}.${hasCurrent ? ' Current holdings are loaded.' : ''} A blank minimum is 0% and a blank maximum 100%.</p>
      <h3 class="ss">View portfolios <span class="r">${s.views.length} view${s.views.length === 1 ? '' : 's'}</span></h3>
      ${views || '<p class="note" style="margin:0 0 8px">No views. Add a view portfolio to tilt expected returns.</p>'}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" id="addabs">+ Absolute view</button><button type="button" class="btn" id="addrel">+ Relative view</button></div>
      <p class="note">A view states what a portfolio of assets will return. One asset at 100% sets that asset's total return; a long leg and a short leg set a spread. The band is ± a percent of the view's return, held with the stated confidence, so a 2% view with a 50% band means 1–3%.</p>`;
    bindInputs();
  }

  function renderView(v, k, u) {
    const legs = Object.entries(v.weights);
    const opts = (sel) => u.asset_names.map((a) => `<option ${a === sel ? 'selected' : ''}>${esc(a)}</option>`).join('');
    const net = legs.reduce((t, [, w]) => t + w, 0);
    const kind = legs.length === 1 && legs[0][1] === 1 ? 'Absolute' : Math.abs(net) < 1e-9 ? 'Relative (zero cost)' : 'Basket';
    return `<div class="view" data-k="${k}">
      <div class="vhead"><input data-f="label" value="${esc(v.label)}" aria-label="View name"><button type="button" class="x" data-f="del" aria-label="Remove view">✕</button></div>
      ${legs.map(([a, w], j) => `<div class="leg"><select data-f="asset" data-j="${j}" aria-label="Asset">${opts(a)}</select><div class="inbox"><input data-f="w" data-j="${j}" type="number" step="10" value="${+(w * 100).toFixed(2)}" aria-label="Weight"><span class="u">%</span></div><button type="button" class="x" data-f="dropleg" data-j="${j}" aria-label="Remove leg" ${legs.length < 2 ? 'disabled' : ''}>−</button></div>`).join('')}
      <button type="button" class="btn lnk" data-f="addleg">+ Add leg</button>
      <div class="vnum"><label>View return %<input data-f="er" type="number" step="0.25" value="${+(v.expected_return * 100).toFixed(3)}"></label><label>Confidence %<input data-f="conf" type="number" step="1" min="1" max="99.9" value="${v.confidence}"></label><label>Band ± % of view<input data-f="band" type="number" step="1" min="0.1" value="${v.band_percent}"></label></div>
      <div class="vsum">${kind} · net weight ${pct(net, 0)}</div></div>`;
  }

  function bindInputs() {
    const s = st();
    const S = s.settings;
    const onNum = (id, f) => { const el = $(id); if (el) el.addEventListener('input', () => { const x = parseFloat(el.value); if (isFinite(x)) { f(x); refresh(); } }); };
    $('guide').addEventListener('toggle', () => {
      guideOpen = $('guide').open;
      try { localStorage.setItem('po-calc-guide', guideOpen ? 'open' : 'closed'); } catch (e) {}
    });
    document.querySelectorAll('.obj').forEach((b) => b.addEventListener('click', () => { S.objective = b.dataset.o; renderInputs(); refresh(); }));
    onNum('p_tr', (x) => { S.target_return = x / 100; });
    onNum('p_tv', (x) => { S.target_volatility = x / 100; });
    onNum('p_ra', (x) => { if (x > 0) S.risk_aversion = x; });
    onNum('p_tau', (x) => { if (x > 0) S.tau = x; });
    [['t_b', 'use_bounds'], ['t_c', 'allow_cash'], ['t_v', 'use_views']].forEach(([id, f]) => {
      $(id).addEventListener('change', () => { S[f] = $(id).checked; renderInputs(); refresh(); });
    });
    document.querySelectorAll('.atab input').forEach((el) => el.addEventListener('input', () => {
      const raw = el.value.trim();
      const x = parseFloat(raw);
      if (el.dataset.f === 'mu') { if (!isFinite(x)) return; s.expected_returns[+el.dataset.i] = x / 100; }
      else {
        // A blank minimum means 0% and a blank maximum 100%.
        const a = el.dataset.a;
        const b = s.bounds[a] ? s.bounds[a].slice() : [0, 1];
        const side = el.dataset.f === 'lo' ? 0 : 1;
        if (raw !== '' && !isFinite(x)) return;
        b[side] = raw === '' ? side : x / 100;
        s.bounds[a] = b;
      }
      refresh();
    }));
    document.querySelectorAll('.view').forEach((box) => {
      const v = s.views[+box.dataset.k];
      const legs = () => Object.entries(v.weights);
      const setLegs = (arr) => { v.weights = {}; arr.forEach(([a, w]) => { v.weights[a] = (v.weights[a] || 0) + w; }); };
      box.querySelectorAll('[data-f]').forEach((el) => {
        const f = el.dataset.f;
        const j = +el.dataset.j;
        if (f === 'del') el.addEventListener('click', () => { s.views.splice(+box.dataset.k, 1); renderInputs(); refresh(); });
        else if (f === 'addleg') el.addEventListener('click', () => {
          const used = Object.keys(v.weights);
          const free = uni().asset_names.find((a) => !used.includes(a));
          if (!free) return;
          v.weights[free] = -1; renderInputs(); refresh();
        });
        else if (f === 'dropleg') el.addEventListener('click', () => { const L = legs(); L.splice(j, 1); setLegs(L); renderInputs(); refresh(); });
        else if (f === 'asset') el.addEventListener('change', () => { const L = legs(); L[j][0] = el.value; setLegs(L); renderInputs(); refresh(); });
        else if (f === 'label') el.addEventListener('input', () => { v.label = el.value; refresh(); });
        else el.addEventListener('input', () => {
          const x = parseFloat(el.value);
          if (!isFinite(x)) return;
          if (f === 'w') { const L = legs(); L[j][1] = x / 100; setLegs(L); box.querySelector('.vsum').textContent = 'Edited · net weight ' + pct(L.reduce((t, l) => t + l[1], 0), 0); }
          if (f === 'er') v.expected_return = x / 100;
          if (f === 'conf') v.confidence = x;
          if (f === 'band') v.band_percent = x;
          refresh();
        });
      });
    });
    const addView = (rel) => {
      const names = uni().asset_names;
      const n = s.views.length;
      const a = names[n % names.length];
      const b = names[(n + 1) % names.length];
      s.views.push(rel
        ? { label: `${a} beats ${b} by 2%`, weights: { [a]: 1, [b]: -1 }, expected_return: 0.02, confidence: 80, band_percent: 50 }
        : { label: `${a} returns 8%`, weights: { [a]: 1 }, expected_return: 0.08, confidence: 80, band_percent: 25 });
      S.use_views = true;
      renderInputs(); refresh();
    };
    $('addabs').addEventListener('click', () => addView(false));
    $('addrel').addEventListener('click', () => addView(true));
  }

  // Results.
  function binding(r, i, w) {
    const lo = r.lower[i];
    const hi = r.upper[i];
    if (lo != null && hi != null && Math.abs(hi - lo) < 1e-9) return '<span class="pill">fixed</span>';
    if (lo != null && Math.abs(w - lo) < 1e-6) return '<span class="pill warn">at min</span>';
    if (hi != null && Math.abs(w - hi) < 1e-6) return '<span class="pill warn">at max</span>';
    return '';
  }

  function renderResults(r, error) {
    const host = $('results');
    if (!r) {
      host.innerHTML = `<div class="box red">${esc(error || 'No result.')}</div>`;
      return;
    }
    const u = uni();
    const P = Object.fromEntries(r.portfolios.map((p) => [p.key, p]));
    const opt = P.optimal;
    const ref = P.current || P.prior || null;
    const o = opt.stats;
    const objLabel = r.objective_label;
    const order = opt.weights.map((w, i) => i).sort((a, b) => opt.weights[b] - opt.weights[a]);
    const top = order.slice(0, 3).map((i) => `${r.names[i]} ${pct(opt.weights[i], 0)}`).join(', ');
    const binds = r.names.filter((a, i) => /at m/.test(binding(r, i, opt.weights[i])));
    const lev = o.cash < -1e-6;
    const cashTxt = Math.abs(o.cash) < 1e-6 ? 'Fully invested' : lev ? `Borrows ${pct(-o.cash)} at the risk-free rate` : `Holds ${pct(o.cash)} in cash`;
    const maxS = P.max_sharpe ? P.max_sharpe.stats.sharpe : (r.objective === 'max_sharpe' ? o.sharpe : null);
    const sharpeGap = maxS != null ? o.sharpe - maxS : null;

    const deltas = ref ? r.names.map((a, i) => ({ a, d: opt.weights[i] - ref.weights[i] })).sort((x, y) => Math.abs(y.d) - Math.abs(x.d)) : [];
    const moveTxt = ref ? deltas.slice(0, 3).filter((x) => Math.abs(x.d) > 0.0005).map((x) => `${x.a} ${pp(x.d, 1)}`).join(', ') : '';

    let viewTxt = '';
    if (r.views.length) {
      const sh = r.names.map((a, i) => ({ a, d: r.expected_returns[i] - r.prior_returns[i] })).sort((x, y) => Math.abs(y.d) - Math.abs(x.d))[0];
      viewTxt = `Views moved ${sh.a}'s expected return most (${pp(sh.d, 2)}).`;
    }

    const kpi = (l, v, d) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
    const refD = (k, f) => (ref ? `${esc(ref.label)} ${f(ref.stats[k])}` : '');
    const warn = [];
    if (error) warn.push(`<div class="box red"><b>Inputs not solvable:</b> ${esc(error)} Showing the last result that solved.</div>`);
    r.warnings.forEach((w) => warn.push(`<div class="box warn">${esc(w)}</div>`));
    if (o.gross > 1.5) warn.push(`<div class="box warn">Gross exposure is ${pct(o.gross, 0)}. Without bounds the optimizer leans on shorts and leverage; turn on weight bounds or raise risk aversion for an investable book.</div>`);

    host.innerHTML = `
      ${warn.join('')}
      <div class="exec">
        <div>
          <div class="eyebrow">Recommendation <span>· ${esc(objLabel)}${r.views.length ? ' · with views' : ''}</span></div>
          <div class="headline">${pct(o.ret)} expected return at ${pct(o.vol)} volatility, a Sharpe ratio of ${num(o.sharpe)}.</div>
          <p class="exec-sub">Largest positions: ${esc(top)}. ${esc(cashTxt)}.${binds.length ? ` ${binds.length} bound${binds.length > 1 ? 's' : ''} bind (${esc(binds.slice(0, 4).join(', '))}${binds.length > 4 ? '…' : ''}).` : ''} ${esc(viewTxt)}</p>
        </div>
        <div class="exec-r">
          ${ref ? `<div class="tp"><div class="tpn">Versus ${esc(ref.label.toLowerCase())}</div><div class="tps">${pp(o.ret - ref.stats.ret, 2)} return · ${pp(o.vol - ref.stats.vol, 2)} risk</div><div class="tpt">Biggest moves: ${esc(moveTxt || 'none')}. One-way turnover ${pct(r.active.turnover)}, tracking error ${pct(r.active.tracking_error, 2)}.</div></div>` : ''}
          <div class="tp"><div class="tpn">Risk budget</div><div class="tps">${esc(r.names[opt.risk.indexOf(Math.max(...opt.risk))])} carries ${pct(Math.max(...opt.risk), 0)} of variance</div><div class="tpt">Effective number of positions ${num(o.effective_n, 1)} of ${r.names.length}.</div></div>
          ${sharpeGap != null && r.objective !== 'max_sharpe' ? `<div class="tp"><div class="tpn">Cost of the objective</div><div class="tps">${sharpeGap > -0.005 ? 'None: same Sharpe ratio as the max-Sharpe mix' : `Sharpe ratio ${num(-sharpeGap)} below the max-Sharpe mix`}</div><div class="tpt">${sharpeGap > -0.005 && Math.abs(o.cash) > 1e-6 ? 'Cash and the tangency portfolio combine on the capital market line. ' : ''}The maximum Sharpe ratio portfolio earns ${pct(P.max_sharpe.stats.ret)} at ${pct(P.max_sharpe.stats.vol)}.</div></div>` : ''}
        </div>
      </div>
      <div class="kpis">
        ${kpi('Expected return', pct(o.ret, 2), refD('ret', (x) => pct(x, 2)) || `Risk-free ${pct(r.risk_free_rate, 2)}`)}
        ${kpi('Volatility', pct(o.vol, 2), refD('vol', (x) => pct(x, 2)) || 'Annual, ex ante')}
        ${kpi('Sharpe ratio', num(o.sharpe), refD('sharpe', num) || 'Over the risk-free rate')}
        ${kpi(lev ? 'Borrowing' : 'Cash', pct(Math.abs(o.cash)), `Gross exposure ${pct(o.gross, 0)}`)}
        ${kpi('Effective positions', num(o.effective_n, 1), `Largest weight ${pct(o.max_weight, 1)}`)}
        ${kpi('Turnover', ref ? pct(r.active.turnover) : '–', ref ? `One way, vs ${esc(ref.label.toLowerCase())}` : 'No current book loaded')}
      </div>

      <section>
        <div class="sechead"><span class="num">1</span><h2>Allocation</h2><span class="hz">Weights, change and share of risk</span></div>
        ${allocationTable(r, opt, ref)}
      </section>

      <section>
        <div class="sechead"><span class="num">2</span><h2>Where the portfolio sits</h2><span class="hz">Efficient frontier, annual</span></div>
        <div class="crow c2">
          <div class="card"><div class="ch"><h3>Risk and return</h3><span>Hover a point for detail</span></div><div class="take"><b>Read</b>${esc(frontierTake(r, P))}</div>${frontierChart(r, P)}</div>
          <div class="card"><div class="ch"><h3>Portfolios compared</h3><span>All scored on the returns in use</span></div>${compareTable(r)}</div>
        </div>
      </section>

      ${r.views.length ? `<section>
        <div class="sechead"><span class="num">3</span><h2>What the views did</h2><span class="hz">Black-Litterman, τ = ${num(st().settings.tau, 3)}</span></div>
        <div class="crow c2">
          <div class="card"><div class="ch"><h3>View portfolios</h3><span>Return of each view portfolio</span></div><div class="take"><b>Read</b>${esc(viewsTake(r))}</div>${viewsTable(r)}</div>
          <div class="card"><div class="ch"><h3>Expected returns, prior to posterior</h3><span>Per asset</span></div>${returnShift(r)}</div>
        </div>
      </section>` : ''}

      <section>
        <div class="sechead"><span class="num">${r.views.length ? 4 : 3}</span><h2>How the mix changes with risk</h2><span class="hz">Fully invested, ${r.frontier.bounded ? 'with bounds' : 'no bounds'}</span></div>
        <div class="card"><div class="ch"><h3>Weights along the efficient frontier</h3><span>From minimum volatility (left) to the highest return the rules allow (right)</span></div><div class="take"><b>Read</b>${esc(transitionTake(r))}</div>${transitionChart(r)}</div>
      </section>

      <section>
        <div class="sechead"><span class="num">${r.views.length ? 5 : 4}</span><h2>History: returns and correlations</h2><span class="hz">${esc(r.history.horizons ? 'Realized' : 'Case assumptions')}</span></div>
        ${historySection(r)}
      </section>

      <section>
        <div class="sechead"><span class="num">${r.views.length ? 6 : 5}</span><h2>Inputs and method</h2></div>
        <div class="meth">
          <div class="card"><div class="ch"><h3>This universe</h3></div><ul style="margin:0;padding-left:18px">${u.notes.map((n) => `<li>${esc(n)}</li>`).join('')}<li><b>Source:</b> ${esc(u.source)}</li></ul></div>
          <div class="card"><div class="ch"><h3>Reading the numbers</h3></div><dl class="gloss">
            <dt>Sharpe ratio</dt><dd>(Expected return − risk-free rate) ÷ volatility.</dd>
            <dt>Risk share</dt><dd>Each asset's share of portfolio variance. Shares sum to 100%; a negative share marks a hedge.</dd>
            <dt>Effective positions</dt><dd>1 ÷ the sum of squared weights: 1 for a single asset, N for N equal weights.</dd>
            <dt>Turnover</dt><dd>Half the sum of absolute weight changes, cash included: the share of the book that trades.</dd>
            <dt>Tracking error</dt><dd>Volatility of the difference between the optimal and reference portfolios.</dd>
            <dt>At min / at max</dt><dd>A binding bound. Loosening it would improve the objective.</dd>
            <dt>Capital market line</dt><dd>Mixes of cash and the max-Sharpe portfolio; every point on it has that Sharpe ratio.</dd>
          </dl></div>
          <div class="card"><div class="ch"><h3>Method</h3></div><ul style="margin:0;padding-left:18px">
            <li><b>Solver.</b> The <code>portfolio_optimization</code> package (0.1.0): <code>MarkowitzPortfolio</code> for minimum variance, tangency, target return and risk aversion; <code>BlackLittermanPortfolio.update_views</code> for the views.</li>
            <li><b>Bounded max Sharpe, min volatility and target volatility</b> search the package's bounded target-return frontier (golden section and bisection to 1e-10).</li>
            <li><b>Views.</b> Posterior μ = [Σ⁻¹ + τP′Ω⁻¹P]⁻¹ [Σ⁻¹π + τP′Ω⁻¹Q]; each view's variance is (Q × band ÷ z)², z set by its confidence.</li>
            <li><b>Cash.</b> With cash on, weights need not sum to 100% and the rest earns or pays the risk-free rate. Max Sharpe and min volatility are always fully invested.</li>
          </ul></div>
        </div>
      </section>`;
    bindTips();
    fitCharts();
  }

  function allocationTable(r, opt, ref) {
    const all = r.portfolios.filter((p) => p.key !== 'equal');
    const lo = Math.min(0, ...opt.weights, ...(ref ? ref.weights : []));
    const hi = Math.max(0.0001, ...opt.weights, ...(ref ? ref.weights : []));
    const span = hi - lo;
    const zx = ((-lo) / span) * 100;
    const bar = (w, c, top) => {
      const a = Math.min(w, 0);
      const b = Math.max(w, 0);
      return `<i style="left:${((a - lo) / span) * 100}%;width:${Math.max(((b - a) / span) * 100, 0.4)}%;background:${c};top:${top}px;height:${ref ? 4 : 8}px"></i>`;
    };
    const order = opt.weights.map((w, i) => i).sort((a, b) => opt.weights[b] - opt.weights[a]);
    const hasBounds = r.lower.some((v) => v != null);
    const rows = order.map((i) => {
      const w = opt.weights[i];
      const d = ref ? w - ref.weights[i] : null;
      const lb = r.lower[i];
      const ub = r.upper[i];
      return `<tr><td class="lab"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${assetColor(r.names.indexOf(r.names[i]))};margin-right:6px"></i>${esc(r.names[i])}</td>
        <td class="num"><b>${tpct(w)}</b></td>
        ${ref ? `<td class="num">${tpct(ref.weights[i])}</td><td class="num ${d > 0.0005 ? 'pos' : d < -0.0005 ? 'neg' : ''}">${tpp(d)}</td>` : ''}
        <td style="width:28%"><div class="bar" style="--zx:${zx}%">${bar(w, 'var(--s1)', ref ? 1 : 2)}${ref ? bar(ref.weights[i], PORT_COLOR[ref.key], 6) : ''}</div></td>
        <td class="num">${tpct(opt.risk[i])}</td>
        <td class="num">${tpct(r.expected_returns[i])}</td>
        ${hasBounds ? `<td class="num" style="color:var(--text-muted)">${tpct(lb, 0)} to ${tpct(ub, 0)}</td><td>${binding(r, i, w)}</td>` : ''}</tr>`;
    }).join('');
    const o = opt.stats;
    const cashRow = Math.abs(o.cash) > 1e-6 || (ref && Math.abs(ref.stats.cash) > 1e-6)
      ? `<tr><td class="lab">Cash (risk-free)</td><td class="num"><b>${tpct(o.cash)}</b></td>${ref ? `<td class="num">${tpct(ref.stats.cash)}</td><td class="num">${tpp(o.cash - ref.stats.cash)}</td>` : ''}<td></td><td class="num">0.0%</td><td class="num">${tpct(r.risk_free_rate)}</td>${hasBounds ? '<td></td><td></td>' : ''}</tr>` : '';
    return `<div class="card"><div class="take"><b>Read</b>Sorted by optimal weight. ${ref ? `Blue bar is the optimal weight, ${PORT_COLOR[ref.key] === 'var(--s2)' ? 'orange' : 'purple'} is ${esc(ref.label.toLowerCase())}. ` : ''}Risk share is each asset's contribution to portfolio variance.</div>
      <div class="tw"><table class="t"><thead><tr><th>Asset</th><th class="num">Optimal</th>${ref ? `<th class="num">${esc(ref.label)}</th><th class="num">Change</th>` : ''}<th>Weight</th><th class="num">Risk share</th><th class="num">E[r]</th>${hasBounds ? '<th class="num">Bounds</th><th></th>' : ''}</tr></thead>
      <tbody>${rows}${cashRow}<tr class="tot"><td>Total</td><td class="num">${tpct(o.net + o.cash)}</td>${ref ? `<td class="num">${tpct(ref.stats.net + ref.stats.cash)}</td><td></td>` : ''}<td></td><td class="num">100.0%</td><td class="num">${tpct(o.ret)}</td>${hasBounds ? '<td></td><td></td>' : ''}</tr></tbody></table></div></div>`;
  }

  function compareTable(r) {
    const rows = r.portfolios.map((p) => `<tr class="${p.key === 'optimal' ? 'hl' : ''}"><td class="lab"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${PORT_COLOR[p.key]};margin-right:6px"></i>${esc(p.label)}</td>
      <td class="num">${tpct(p.stats.ret, 2)}</td><td class="num">${tpct(p.stats.vol, 2)}</td><td class="num">${num(p.stats.sharpe)}</td><td class="num">${tpct(p.stats.cash, 2)}</td><td class="num">${num(p.stats.effective_n, 1)}</td><td class="num">${tpct(p.stats.max_weight, 2)}</td></tr>`).join('');
    return `<div class="tw"><table class="t"><thead><tr><th>Portfolio</th><th class="num">E[r]</th><th class="num">Vol</th><th class="num">Sharpe</th><th class="num">Cash</th><th class="num">Eff. N</th><th class="num">Max wt</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="note">Optimal is the selected objective. Max Sharpe and min volatility obey the same bounds; equal weight ignores them. ${r.portfolios.some((p) => p.key === 'prior') ? 'Before views solves the same objective on the prior returns and is scored on the posterior returns.' : ''}</p>`;
  }

  function viewsTable(r) {
    const rows = r.views.map((v) => `<tr><td class="lab" style="white-space:normal">${esc(v.label)}</td><td class="num">${tpct(v.view, 2)}</td><td class="num">${tpct(v.prior, 2)}</td><td class="num"><b>${tpct(v.posterior, 2)}</b></td><td class="num">${tpp(v.posterior - v.prior, 2)}</td></tr>`).join('');
    return `<div class="tw"><table class="t"><thead><tr><th>View</th><th class="num">View</th><th class="num">Prior</th><th class="num">Posterior</th><th class="num">Shift</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="note">A posterior close to the view means the view outweighed the prior. To lean on a view more, narrow its band, raise its confidence or raise τ.</p>`;
  }

  // Keeps chart text at CHART_FONT_PX screen pixels however wide the chart is drawn.
  const CHART_FONT_PX = 12.5;
  // Below this drawn-to-viewBox ratio (phones), text shrinks with the chart.
  const MIN_CHART_SCALE = 0.8;
  // Expected drawn-to-viewBox ratio of a half-width card chart, used to size
  // label boxes before the chart is in the page.
  function halfChartScale() {
    const w = $('results').clientWidth || 1000;
    const card = window.innerWidth > 1500 ? (w - 16) / 2 - 30 : w - 30;
    return Math.max(card / W, MIN_CHART_SCALE);
  }
  function fitCharts() {
    document.querySelectorAll('svg.chart').forEach((svg) => {
      const vb = svg.viewBox.baseVal;
      const box = svg.getBoundingClientRect();
      // The drawing scales to fit both sides, so the tighter side sets the scale.
      const k = vb.width && vb.height ? Math.min(box.width / vb.width, box.height / vb.height) : 0;
      if (k > 0) svg.style.setProperty('--fs', `${(CHART_FONT_PX / Math.max(k, MIN_CHART_SCALE)).toFixed(2)}px`);
    });
  }
  window.addEventListener('resize', () => { clearTimeout(fitCharts.t); fitCharts.t = setTimeout(fitCharts, 100); });

  // History: realized returns by horizon and the correlation matrix.
  function heatColor(rho) {
    const a = Math.round(Math.min(Math.abs(rho), 1) * 55);
    return `color-mix(in srgb, ${rho >= 0 ? 'var(--s1)' : 'var(--s2)'} ${a}%, transparent)`;
  }

  // Equal-width number columns after a label column sized to its longest
  // label (about 8px a character at 13.5px Arial, plus padding).
  function gridCols(labels, n) {
    const label = Math.max(...labels.map((a) => a.length)) * 8 + 34;
    return `<colgroup><col style="width:${label}px">${'<col>'.repeat(n)}</colgroup>`;
  }

  function correlationTable(names, corr) {
    const short = (a) => (a.match(/\(([^)]+)\)$/) || [null, a])[1];
    // Long single words get a soft hyphen so narrow columns break cleanly.
    const soft = (t) => esc(t).replace(/\b(\w{6})(\w{4,})\b/g, '$1&shy;$2');
    const head = names.map((a) => `<th class="num" title="${esc(a)}">${soft(short(a))}</th>`).join('');
    const rows = names.map((a, i) => `<tr><td class="lab" title="${esc(a)}">${esc(short(a))}</td>${corr[i].map((v, j) => (i === j
      ? '<td class="num diag">100%</td>'
      : `<td class="num" style="background:${heatColor(v)}">${tpct(v, 0)}</td>`)).join('')}</tr>`).join('');
    return `<div class="tw"><table class="t heat compact grid">${gridCols(names.map(short), names.length)}<thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function corrExtremes(names, corr) {
    const pairs = [];
    names.forEach((a, i) => names.forEach((b, j) => { if (j > i) pairs.push({ a, b, v: corr[i][j] }); }));
    pairs.sort((x, y) => y.v - x.v);
    return { hi: pairs[0], lo: pairs[pairs.length - 1] };
  }

  function historySection(r) {
    const h = r.history;
    const n = r.names;
    if (!h.horizons) {
      const ex = corrExtremes(n, r.correlation);
      return `<div class="card"><div class="ch"><h3>Correlation matrix used by the optimizer</h3><span>Case assumptions; this universe has no return history</span></div>
        <div class="take"><b>Read</b>${esc(`The most correlated pair is ${ex.hi.a} and ${ex.hi.b} (${pct(ex.hi.v, 0)}); the least is ${ex.lo.a} and ${ex.lo.b} (${pct(ex.lo.v, 0)}).`)}</div>
        ${correlationTable(n, r.correlation)}</div>`;
    }
    const full = h.horizons[h.horizons.length - 1];
    const order = full.returns.map((v, i) => i).sort((a, b) => full.returns[b] - full.returns[a]);
    const best = order[0];
    const worst = order[order.length - 1];
    const ex = corrExtremes(n, h.correlation);
    const cell = (v) => `<td class="num ${v < -0.0005 ? 'neg' : ''}">${tpct(v)}</td>`;
    const rows = n.map((a, i) => `<tr><td class="lab"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${assetColor(i)};margin-right:6px"></i>${esc(a)}</td>${h.horizons.map((x) => cell(x.returns[i])).join('')}<td class="num">${tpct(h.volatility[i])}</td>${cell(h.max_drawdown[i])}</tr>`).join('');
    const head = (x) => x.label.replace(/^Since \w+ /, 'Since ');
    return `<div class="hist">
      <div class="card"><div class="ch"><h3>Annualized total return</h3><span>Trailing, compounded</span></div>
        <div class="take"><b>Read</b>${esc(`${full.label}, ${n[best]} returned most (${pct(full.returns[best])} a year) and ${n[worst]} least (${pct(full.returns[worst])}).`)}</div>
        <div class="tw"><table class="t compact grid">${gridCols(n, h.horizons.length + 2)}<thead><tr><th>Asset</th>${h.horizons.map((x) => `<th class="num">${esc(head(x))}</th>`).join('')}<th class="num">Vol</th><th class="num">Max DD</th></tr></thead><tbody>${rows}</tbody></table></div>
        <p class="note">${esc(h.label)} Vol and max drawdown (Max DD) cover the full history.</p></div>
      <div class="card"><div class="ch"><h3>Correlation matrix</h3><span>${esc(full.label)}, ${esc(h.label.split(',')[0].split(' ')[0].toLowerCase())} returns</span></div>
        <div class="take"><b>Read</b>${esc(`The most correlated pair is ${ex.hi.a} and ${ex.hi.b} (${pct(ex.hi.v, 0)}); the least is ${ex.lo.a} and ${ex.lo.b} (${pct(ex.lo.v, 0)}).`)}</div>
        ${correlationTable(n, h.correlation)}
        <p class="note">Shading deepens with the size of the correlation; negatives are in parentheses.</p></div>
    </div>`;
  }

  // One-line readings for the cards.
  function frontierTake(r, P) {
    const o = P.optimal.stats;
    const best = (f) => Math.max(...f.map((p) => (p.ret - r.risk_free_rate) / p.vol));
    const parts = [];
    if (Math.abs(o.cash) > 1e-6) {
      parts.push(`The optimal mix ${o.cash > 0 ? `holds ${pct(o.cash)} cash` : `borrows ${pct(-o.cash)}`} against risky assets, so it sits on the capital market line.`);
    } else if (r.objective === 'max_sharpe') {
      parts.push('The optimal mix is the tangency portfolio: the highest Sharpe ratio the rules allow.');
    } else {
      parts.push(`The optimal mix sits on the ${r.frontier.bounded ? 'bounded ' : ''}frontier at ${pct(o.vol)} volatility.`);
    }
    if (r.frontier.bounded) {
      const gap = best(r.frontier.unbounded) - best(r.frontier.bounded);
      if (gap > 0.005) parts.push(`Bounds cost ${num(gap)} of Sharpe ratio: the best unbounded mix reaches ${num(best(r.frontier.unbounded))}, against ${num(best(r.frontier.bounded))} with bounds.`);
      else parts.push('Bounds cost almost nothing in Sharpe ratio here.');
    }
    return parts.join(' ');
  }

  function viewsTake(r) {
    const shifts = r.names.map((a, i) => ({ a, d: r.expected_returns[i] - r.prior_returns[i] }))
      .sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 2).filter((x) => Math.abs(x.d) > 0.00005);
    const close = r.views.filter((v) => Math.abs(v.posterior - v.view) < Math.abs(v.prior - v.view) * 0.2).length;
    const moved = shifts.length ? `Views moved expected returns most for ${shifts.map((x) => `${x.a} (${pp(x.d, 2)})`).join(' and ')}. ` : 'Views barely moved expected returns. ';
    return moved + `${close} of ${r.views.length} view${r.views.length > 1 ? 's' : ''} ended within 20% of ${r.views.length > 1 ? 'their' : 'its'} stated return, so the views${close ? '' : ' do not'} outweigh the prior there.`;
  }

  function transitionTake(r) {
    const f = r.frontier.bounded || r.frontier.unbounded;
    const first = f[0].weights;
    const last = f[f.length - 1].weights;
    const moves = r.names.map((a, i) => ({ a, d: last[i] - first[i], from: first[i], to: last[i] }));
    const up = moves.slice().sort((x, y) => y.d - x.d)[0];
    const down = moves.slice().sort((x, y) => x.d - y.d)[0];
    const fmt = (m) => `${m.a} (${pct(m.from, 0)} to ${pct(m.to, 0)})`;
    if (up.d < 0.005 && down.d > -0.005) return 'The mix barely changes along the frontier: the bounds fix most weights.';
    return `Taking more risk, the optimizer adds most to ${fmt(up)} and cuts ${fmt(down)}, from minimum volatility to the highest return the rules allow.`;
  }

  // SVG helpers.
  const W = 640;
  function scale(d0, d1, r0, r1) { const k = (r1 - r0) / (d1 - d0 || 1); return (v) => r0 + (v - d0) * k; }
  function ticks(a, b, n) {
    const step0 = (b - a) / n;
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0) || step0;
    const out = [];
    for (let v = Math.ceil(a / step - 1e-9) * step; v <= b + 1e-12; v += step) out.push(+v.toFixed(10));
    // Decimals the step needs in percent: 5% -> 0, 2.5% -> 1, 0.25% -> 2.
    const stepPct = Math.round(step * 1e6) / 1e4;
    out.dp = [0, 1, 2, 3].find((d) => Math.abs(stepPct * Math.pow(10, d) - Math.round(stepPct * Math.pow(10, d))) < 1e-6) ?? 2;
    out.step = step;
    return out;
  }
  // Widens [a, b] to whole tick steps so the outermost marks are labelled.
  function niceDomain(a, b, n) {
    const t = ticks(a, b, n);
    return [Math.floor(a / t.step + 1e-9) * t.step, Math.ceil(b / t.step - 1e-9) * t.step];
  }

  function returnShift(r) {
    const H = 30 + r.names.length * 24;
    const vals = r.prior_returns.concat(r.expected_returns);
    const lo = Math.min(0, ...vals);
    const hi = Math.max(...vals);
    const pad = (hi - lo) * 0.06;
    const x = scale(lo - pad, hi + pad, 110, W - 20);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Prior and posterior expected returns">`;
    ticks(lo, hi, 5).forEach((t, i, T) => { s += `<line class="gl" x1="${x(t)}" x2="${x(t)}" y1="8" y2="${H - 20}"/><text x="${x(t)}" y="${H - 6}" text-anchor="middle">${pct(t, T.dp)}</text>`; });
    r.names.forEach((a, i) => {
      const y = 20 + i * 24;
      const p = r.prior_returns[i];
      const q = r.expected_returns[i];
      s += `<text x="102" y="${y + 4}" text-anchor="end">${esc(a.length > 15 ? a.slice(0, 14) + '…' : a)}</text>`;
      s += `<line x1="${x(p)}" x2="${x(q)}" y1="${y}" y2="${y}" stroke="var(--s5)" stroke-width="2"/>`;
      s += `<circle cx="${x(p)}" cy="${y}" r="4" fill="var(--surface-1)" stroke="var(--text-muted)" stroke-width="1.5"/><circle cx="${x(q)}" cy="${y}" r="4.5" fill="var(--s5)" class="hot" data-tip="${esc(`<b>${a}</b><br>Prior ${pct(p, 2)} → posterior ${pct(q, 2)} (${pp(q - p, 2)})`)}"/>`;
    });
    return `<div class="legend"><span><i class="dot" style="background:var(--surface-1);border:1.5px solid var(--text-muted)"></i>Prior</span><span><i class="dot" style="background:var(--s5)"></i>Posterior</span></div>${s}</svg>`;
  }

  // Places each label beside its point (right, left, above, below), skipping
  // positions that hit a placed label, a marker or the plot edge. Labels
  // with no free position are hidden; their points keep their tooltips.
  const LABEL_CHAR_PX = 6.6;
  const LABEL_HEIGHT_PX = 12.5;
  function placeLabels(labels, marks, frame) {
    const boxes = marks.map((m) => ({ x0: m.x - m.r, x1: m.x + m.r, y0: m.y - m.r, y1: m.y + m.r }))
      .concat(labels.map((l) => ({ x0: l.x - 4, x1: l.x + 4, y0: l.y - 4, y1: l.y + 4 })));
    const hit = (b) => b.x0 < frame.x0 || b.x1 > frame.x1 || b.y0 < frame.y0 || b.y1 > frame.y1 ||
      boxes.some((o) => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0);
    const shown = [];
    let hidden = 0;
    const k = halfChartScale();
    labels.slice().sort((a, b) => a.y - b.y || a.x - b.x).forEach((l) => {
      const w = (l.text.length * LABEL_CHAR_PX) / k;
      const h = LABEL_HEIGHT_PX / k;
      const options = [
        { tx: l.x + 7, ty: l.y + 3.5, anchor: 'start', b: { x0: l.x + 6, x1: l.x + 8 + w, y0: l.y - h / 2, y1: l.y + h / 2 } },
        { tx: l.x - 7, ty: l.y + 3.5, anchor: 'end', b: { x0: l.x - 8 - w, x1: l.x - 6, y0: l.y - h / 2, y1: l.y + h / 2 } },
        { tx: l.x, ty: l.y - 7, anchor: 'middle', b: { x0: l.x - w / 2, x1: l.x + w / 2, y0: l.y - 7 - h + 2, y1: l.y - 5 } },
        { tx: l.x, ty: l.y + 15, anchor: 'middle', b: { x0: l.x - w / 2, x1: l.x + w / 2, y0: l.y + 6, y1: l.y + 6 + h } },
      ];
      const pick = options.find((o) => !hit(o.b));
      if (!pick) { hidden += 1; return; }
      boxes.push(pick.b);
      shown.push(Object.assign({ text: l.text }, pick));
    });
    return { shown, hidden };
  }

  // Fits variance = a r² + b r + c through the first, middle and last points
  // of an unbounded frontier; rMin is the minimum-variance return.
  function hyperbola(f) {
    const pts3 = [f[0], f[Math.floor(f.length / 2)], f[f.length - 1]].map((p) => [p.ret, p.vol * p.vol]);
    const [[r1, v1], [r2, v2], [r3, v3]] = pts3;
    const d = (r1 - r2) * (r1 - r3) * (r2 - r3);
    const a = (r3 * (v2 - v1) + r2 * (v1 - v3) + r1 * (v3 - v2)) / d;
    const b = (r3 * r3 * (v1 - v2) + r2 * r2 * (v3 - v1) + r1 * r1 * (v2 - v3)) / d;
    const c = (r2 * r3 * (r2 - r3) * v1 + r3 * r1 * (r3 - r1) * v2 + r1 * r2 * (r1 - r2) * v3) / d;
    // Returns on the lower and upper branch where volatility equals vol.
    const returnsAt = (vol) => {
      const disc = b * b - 4 * a * (c - vol * vol);
      if (!(a > 0) || disc < 0) return [Infinity, -Infinity];
      return [(-b - Math.sqrt(disc)) / (2 * a), (-b + Math.sqrt(disc)) / (2 * a)];
    };
    return { variance: (ret) => a * ret * ret + b * ret + c, rMin: -b / (2 * a), returnsAt };
  }

  function frontierChart(r, P) {
    const H = 380;
    const fu = r.frontier.unbounded;
    const fb = r.frontier.bounded;
    const pts = r.portfolios;
    const xs = [0].concat(fu.map((p) => p.vol), fb ? fb.map((p) => p.vol) : [], r.volatilities, pts.map((p) => p.stats.vol));
    const ys = [r.risk_free_rate].concat(fu.map((p) => p.ret), fb ? fb.map((p) => p.ret) : [], r.expected_returns, pts.map((p) => p.stats.ret));
    const xmax = Math.max(...xs) * 1.06;
    // Stretch the return axis so the unbounded frontier reaches the right
    // edge on both branches, up to 60% of the data range on each side.
    const hyp = hyperbola(fu);
    const dataLo = Math.min(...ys);
    const dataHi = Math.max(...ys);
    const span = dataHi - dataLo;
    const [edgeLo, edgeHi] = hyp.returnsAt(xmax);
    const ymin = Math.max(Math.min(dataLo, edgeLo), dataLo - 0.6 * span);
    const ymax = Math.min(Math.max(dataHi, edgeHi), dataHi + 0.6 * span);
    const yp = (ymax - ymin) * 0.04;
    const x = scale(0, xmax, 52, W - 16);
    const top = 28;
    const y = scale(ymin - yp, ymax + yp, H - 34, top);
    let s = `<svg class="chart half" viewBox="0 0 ${W} ${H}" role="img" aria-label="Efficient frontier with portfolios and assets">`;
    // One decimal setting for both axes, so 5% and 5.0% never sit side by side.
    const XT = ticks(0, xmax, 6);
    const YT = ticks(ymin - yp, ymax + yp, 6);
    const dp = Math.max(XT.dp, YT.dp);
    XT.forEach((t) => { s += `<line class="gl" x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H - 34}"/><text x="${x(t)}" y="${H - 18}" text-anchor="middle">${pct(t, dp)}</text>`; });
    YT.forEach((t) => { s += `<line class="gl" x1="52" x2="${W - 16}" y1="${y(t)}" y2="${y(t)}"/><text x="46" y="${y(t) + 4}" text-anchor="end">${pct(t, dp)}</text>`; });
    s += `<text x="${W - 16}" y="${H - 3}" text-anchor="end" class="lbl">Volatility →</text><text x="8" y="12" class="lbl">Expected return ↑</text>`;
    s += `<clipPath id="fc"><rect x="52" y="${top}" width="${W - 68}" height="${H - 34 - top}"/></clipPath><g clip-path="url(#fc)">`;
    const ms = P.max_sharpe || (r.objective === 'max_sharpe' ? P.optimal : null);
    if (ms) {
      const k = ms.stats.sharpe;
      s += `<line x1="${x(0)}" y1="${y(r.risk_free_rate)}" x2="${x(xmax)}" y2="${y(r.risk_free_rate + k * xmax)}" stroke="var(--s3)" stroke-width="1.2" stroke-dasharray="5 4"/>`;
    }
    const path = (f) => f.map((p, i) => `${i ? 'L' : 'M'}${x(p.vol).toFixed(1)},${y(p.ret).toFixed(1)}`).join('');
    // The unbounded frontier is a hyperbola: variance is quadratic in return.
    // Fit it through three solved points and draw it across the whole chart,
    // with the inefficient lower branch dashed (as in the 2018 package plot).
    const yLo = ymin - yp;
    const yHi = ymax + yp;
    const branch = (r0, r1) => {
      const pts2 = [];
      for (let k = 0; k <= 160; k += 1) {
        const ret = r0 + ((r1 - r0) * k) / 160;
        pts2.push({ ret, vol: Math.sqrt(Math.max(hyp.variance(ret), 0)) });
      }
      return path(pts2);
    };
    s += `<path d="${branch(Math.min(yLo, hyp.rMin), Math.max(yHi, hyp.rMin))}" fill="none" stroke="var(--text-muted)" stroke-width="1.6"/>`;
    if (fb) s += `<path d="${path(fb)}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
    s += '</g>';
    // Markers first, then labels placed around them without collisions.
    const marks = pts.map((p) => ({ x: x(p.stats.vol), y: y(p.stats.ret), r: p.key === 'optimal' ? 8 : 6 }));
    const labels = [{ x: x(0), y: y(r.risk_free_rate), r: 4, text: 'Risk-free' }];
    r.names.forEach((a, i) => {
      const cx = x(r.volatilities[i]);
      const cy = y(r.expected_returns[i]);
      s += `<rect x="${cx - 3.5}" y="${cy - 3.5}" width="7" height="7" fill="${assetColor(i)}" class="hot" data-tip="${esc(`<b>${a}</b><br>E[r] ${pct(r.expected_returns[i], 2)} · vol ${pct(r.volatilities[i], 1)}`)}"/>`;
      labels.push({ x: cx, y: cy, r: 4, text: a.length > 22 ? a.slice(0, 21) + '…' : a });
    });
    s += `<circle cx="${x(0)}" cy="${y(r.risk_free_rate)}" r="3.5" fill="var(--text-muted)"/>`;
    const placed = placeLabels(labels, marks, { x0: 52, x1: W - 4, y0: top, y1: H - 30 });
    placed.shown.forEach((l) => { s += `<text x="${l.tx.toFixed(1)}" y="${l.ty.toFixed(1)}" text-anchor="${l.anchor}" class="lbl">${esc(l.text)}</text>`; });
    pts.slice().reverse().forEach((p) => {
      const big = p.key === 'optimal';
      s += `<circle cx="${x(p.stats.vol)}" cy="${y(p.stats.ret)}" r="${big ? 7.5 : 5.5}" fill="${PORT_COLOR[p.key]}" stroke="var(--surface-1)" stroke-width="2" class="hot" data-tip="${esc(`<b>${p.label}</b><br>E[r] ${pct(p.stats.ret, 2)} · vol ${pct(p.stats.vol, 2)}<br>Sharpe ${num(p.stats.sharpe)} · cash ${pct(p.stats.cash, 1)}`)}"/>`;
    });
    s += '</svg>';
    const leg = [`<span><i class="ln" style="background:var(--ink)"></i>Frontier, with bounds</span>`, `<span><i class="ln" style="background:var(--text-muted)"></i>Frontier, no bounds</span>`, ms ? `<span><i class="ln" style="background:var(--s3)"></i>Capital market line</span>` : '']
      .filter((x, i) => fb || i !== 0).concat(pts.map((p) => `<span><i class="dot" style="background:${PORT_COLOR[p.key]}"></i>${esc(p.label)}</span>`));
    return `<div class="legend">${leg.join('')}</div>${s}<div class="foot">Squares are single assets${placed.hidden ? `; ${placed.hidden} label${placed.hidden > 1 ? 's' : ''} hidden where points overlap (hover for the name)` : ''}. The grey curve is the frontier with no bounds, both halves; ${fb ? 'the dark line is the frontier with bounds.' : 'the upper half is efficient.'}</div>`;
  }

  function transitionChart(r) {
    const f = r.frontier.bounded || r.frontier.unbounded;
    const H = 320;
    const W = 1100;
    const n = r.names.length;
    const anyShort = f.some((p) => p.weights.some((w) => w < -1e-6));
    const x = scale(f[0].vol, f[f.length - 1].vol, 52, W - 16);
    let s = `<svg class="chart wide" viewBox="0 0 ${W} ${H}" role="img" aria-label="Asset weights along the efficient frontier">`;
    let y;
    if (!anyShort) {
      y = scale(0, 1, H - 34, 12);
      [0, 0.25, 0.5, 0.75, 1].forEach((t) => { s += `<line class="gl" x1="52" x2="${W - 16}" y1="${y(t)}" y2="${y(t)}"/><text x="46" y="${y(t) + 4}" text-anchor="end">${pct(t, 0)}</text>`; });
      const base = f.map(() => 0);
      for (let i = 0; i < n; i += 1) {
        const top = f.map((p, k) => base[k] + Math.max(p.weights[i], 0));
        const d = top.map((v, k) => `${k ? 'L' : 'M'}${x(f[k].vol).toFixed(1)},${y(v).toFixed(1)}`).join('') +
          base.map((v, k) => [k, v]).reverse().map(([k, v]) => `L${x(f[k].vol).toFixed(1)},${y(v).toFixed(1)}`).join('') + 'Z';
        s += `<path d="${d}" fill="${assetColor(i)}" fill-opacity=".85" stroke="var(--surface-1)" stroke-width=".6"/>`;
        top.forEach((v, k) => { base[k] = v; });
      }
    } else {
      const all = f.flatMap((p) => p.weights);
      const [lo, hi] = niceDomain(Math.min(...all, 0), Math.max(...all), 6);
      y = scale(lo, hi, H - 34, 12);
      ticks(lo, hi, 6).forEach((t, i, T) => { s += `<line class="${Math.abs(t) < 1e-12 ? 'ax' : 'gl'}" x1="52" x2="${W - 16}" y1="${y(t)}" y2="${y(t)}"/><text x="46" y="${y(t) + 4}" text-anchor="end">${pct(t, T.dp)}</text>`; });
      for (let i = 0; i < n; i += 1) {
        s += `<path d="${f.map((p, k) => `${k ? 'L' : 'M'}${x(p.vol).toFixed(1)},${y(p.weights[i]).toFixed(1)}`).join('')}" fill="none" stroke="${assetColor(i)}" stroke-width="2"/>`;
      }
    }
    ticks(f[0].vol, f[f.length - 1].vol, 6).forEach((t, i, T) => { s += `<text x="${x(t)}" y="${H - 18}" text-anchor="middle">${pct(t, T.dp)}</text>`; });
    s += `<text x="${W - 16}" y="${H - 3}" text-anchor="end" class="lbl">Portfolio volatility →</text>`;
    const ov = r.portfolios[0].stats.vol;
    if (ov >= f[0].vol - 1e-9 && ov <= f[f.length - 1].vol + 1e-9 && Math.abs(r.portfolios[0].stats.cash) < 1e-6) {
      s += `<line x1="${x(ov)}" x2="${x(ov)}" y1="12" y2="${H - 34}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${x(ov) + (x(ov) > W - 90 ? -5 : 5)}" y="24" text-anchor="${x(ov) > W - 90 ? 'end' : 'start'}" style="fill:var(--ink);font-weight:700">Optimal</text>`;
    }
    s += `<rect x="52" y="12" width="${W - 68}" height="${H - 46}" fill="transparent" id="trhot"/></svg>`;
    const leg = r.names.map((a, i) => `<span><i style="background:${assetColor(i)}"></i>${esc(a)}</span>`).join('');
    return `<div class="legend">${leg}</div><div class="tw">${s}</div><div class="foot">${anyShort ? 'Lines, because the frontier holds short positions here.' : 'Stacked weights; each column sums to 100%.'} ${r.frontier.bounded ? '' : 'No bounds are on, so the frontier is unconstrained.'}</div>`;
  }

  function bindTips() {
    const tt = $('tt');
    document.querySelectorAll('.hot').forEach((el) => {
      el.addEventListener('mousemove', (e) => {
        tt.innerHTML = el.dataset.tip; tt.hidden = false;
        const w = tt.offsetWidth;
        tt.style.left = Math.min(e.clientX + 14, window.innerWidth - w - 8) + 'px';
        tt.style.top = e.clientY + 14 + 'px';
      });
      el.addEventListener('mouseleave', () => { tt.hidden = true; });
    });
    const hot = $('trhot');
    if (hot && lastResult) {
      const r = lastResult;
      const f = r.frontier.bounded || r.frontier.unbounded;
      hot.addEventListener('mousemove', (e) => {
        const box = hot.getBoundingClientRect();
        const t = Math.max(0, Math.min(1, (e.clientX - box.left) / box.width));
        const p = f[Math.round(t * (f.length - 1))];
        const rows = p.weights.map((w, i) => [r.names[i], w]).filter(([, w]) => Math.abs(w) > 0.0005).sort((a, b) => b[1] - a[1]).slice(0, 8);
        tt.innerHTML = `<b>Vol ${pct(p.vol, 2)} · E[r] ${pct(p.ret, 2)}</b><br>` + rows.map(([a, w]) => `${esc(a)} ${tpct(w)}`).join('<br>');
        tt.hidden = false;
        tt.style.left = Math.min(e.clientX + 14, window.innerWidth - tt.offsetWidth - 8) + 'px';
        tt.style.top = e.clientY + 14 + 'px';
      });
      hot.addEventListener('mouseleave', () => { tt.hidden = true; });
    }
  }

  // Theme and reset.
  function themeNow() {
    const t = document.documentElement.getAttribute('data-theme');
    if (t) return t;
    return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function paintThemeBtn() { $('themebtn').textContent = themeNow() === 'dark' ? 'Light' : 'Dark'; }
  $('themebtn').addEventListener('click', () => {
    const next = themeNow() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('po-calc-theme', next); } catch (e) {}
    paintThemeBtn();
  });
  $('resetbtn').addEventListener('click', () => { state[active] = freshState(uni()); renderInputs(); refresh(); });
  $('foot').innerHTML = 'Built on my <a href="/portfolio-optimization/"><code>portfolio_optimization</code></a> Python library (2018), ported to run in the browser. Factor data from the <a href="https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html">Ken French Data Library</a>. Expected returns, bounds and views are inputs, not forecasts. The views here are my own and do not represent those of my employer. Nothing here is investment advice.';

  paintThemeBtn();
  renderTabs();
  renderInputs();
  refresh();
})();
</script>
