# ---------------------------------------------------------------
# The four pillars. A pillar's tab appears only once it has at
# least one post (front matter `pillar: <id>`) or a standalone page.
# `series` sets the order of the groups on the pillar page.
# ---------------------------------------------------------------
pillars:
  - id: investing
    name: Investing
    title: Financial Services, FinTech, and Complex Situations
    blurb: Essays, theses, and the frameworks I use to underwrite.
    series: [essays, theses, notes]
  - id: academic
    name: Academic
    title: Mathematics and Economics
    blurb: Research papers, machine-learning projects, code, and lecture notes from Waterloo and Columbia.
    series: [research, projects, code, notes]
  - id: culture
    name: Culture
    title: Travel, Food, and History
    blurb: Travel journals, places worth the trip, and every recipe in Johnew's Kitchen.
    series: [travel, food, history, books]
  - id: sports
    name: Sports
    title: Celtics, Tennis, and the Numbers
    blurb: Notes on the Celtics, the games I play, and sports analytics.
    series: [celtics, tennis, analytics]

series_names:
  research: Research
  projects: Projects
  code: Code & Tutorials
  notes: Lecture Notes
  essays: Essays
  theses: Theses
  travel: Travel
  food: Food
  history: History
  books: Books
  celtics: Celtics
  tennis: Tennis
  analytics: Analytics

# ---------------------------------------------------------------
# Build
# ---------------------------------------------------------------
permalink: /:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  hard_wrap: false
timezone: America/Toronto

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      math: true
  - scope: { path: "" }
    values:
      image: /assets/images/share-logo.png

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - vendor
  - node_modules
  - _config-dev.yml
