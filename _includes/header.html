{%- include active-pillars.html -%}
<header>
  <div class="band">
    <div class="inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="mark" aria-hidden="true">JZ</span>
        <span><span class="brand-name">{{ site.name }}</span><span class="brand-sub" style="display:block">{{ site.tagline }}</span></span>
      </a>
      <button class="band-btn" type="button" id="themeBtn" aria-label="Switch between light and dark mode">Dark mode</button>
    </div>
  </div>
  <nav class="tabs" aria-label="Sections">
    <ul>
      <li><a href="{{ '/' | relative_url }}"{% if page.layout == 'home' %} aria-current="page"{% endif %}>Home</a></li>
      {%- for p in site.pillars %}{% if active_pillars contains p.id %}
      <li class="p-{{ p.id }}"><a href="{{ '/' | append: p.id | append: '/' | relative_url }}"{% if page.pillar == p.id %} aria-current="page"{% endif %}>{{ p.name }}</a></li>
      {%- endif %}{% endfor %}
      <li><a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a></li>
    </ul>
  </nav>
</header>
